name: Release AAB

on:
  workflow_dispatch:
    inputs:
      play_track:
        description: Play track — internal, alpha (closed testing), or production
        type: choice
        options:
          - internal
          - alpha
          - production
        default: internal
      release_notes:
        description: Optional release notes for Play + GitHub. Leave empty to auto-generate from git commits.
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "tools platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Version for this run
        run: |
          echo "PIFLASH_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "PIFLASH_VERSION_NAME=3.2.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "versionName 3.2.${{ github.run_number }} / versionCode ${{ github.run_number }}"

      - name: Resolve Play track
        run: |
          TRACK="${{ github.event.inputs.play_track }}"
          TRACK="${TRACK:-internal}"
          echo "PLAY_TRACK=$TRACK" >> "$GITHUB_ENV"
          echo "Play track: $TRACK"

      - name: Generate release notes
        env:
          MANUAL_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          set -euo pipefail
          mkdir -p play-whatsnew fastlane/metadata/android/en-US/changelogs
          NOTES_FULL="$RUNNER_TEMP/release-notes.md"
          NOTES_PLAY="$RUNNER_TEMP/play-notes.txt"

          if [ -n "${MANUAL_NOTES:-}" ]; then
            printf '%s\n' "$MANUAL_NOTES" > "$NOTES_FULL"
          else
            PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            {
              echo "What's new in PiFlash ${PIFLASH_VERSION_NAME}"
              echo
              if [ -n "$PREV" ]; then
                git log --pretty=format:'• %s' --no-merges "${PREV}..HEAD"
              else
                git log --pretty=format:'• %s' --no-merges -n 12
              fi
              echo
            } > "$NOTES_FULL"
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os

          src = Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"
          text = src.read_text(encoding="utf-8").strip()
          if not text:
              text = f"PiFlash {os.environ.get('PIFLASH_VERSION_NAME', '')}"

          # Google Play per-locale release notes max is 500 characters.
          play = text
          if len(play) > 500:
              play = play[:497].rsplit("\n", 1)[0].rstrip()
              if len(play) > 497:
                  play = play[:497]
              play = play.rstrip() + "…"

          Path("play-whatsnew/whatsnew-en-US").write_text(play + "\n", encoding="utf-8")
          Path(os.environ["RUNNER_TEMP"], "play-notes.txt").write_text(play + "\n", encoding="utf-8")

          code = os.environ.get("PIFLASH_VERSION_CODE", "0")
          Path(f"fastlane/metadata/android/en-US/changelogs/{code}.txt").write_text(play + "\n", encoding="utf-8")

          print("--- Play release notes ---")
          print(play)
          print(f"--- ({len(play)} chars) ---")
          PY

          echo "RELEASE_NOTES_FILE=$NOTES_FULL" >> "$GITHUB_ENV"
          echo "PLAY_WHATSNEW_DIR=$GITHUB_WORKSPACE/play-whatsnew" >> "$GITHUB_ENV"

      - name: Prepare upload keystore
        env:
          PIFLASH_STORE_BASE64: ${{ secrets.PIFLASH_STORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.PIFLASH_STORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.PIFLASH_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.PIFLASH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$HOME/piflash-upload.jks"
          if [ -n "${PIFLASH_STORE_BASE64:-}" ]; then
            echo "$PIFLASH_STORE_BASE64" | base64 -d > "$KS"
            echo "Using PIFLASH_STORE_BASE64 secret"
            echo "PIFLASH_STORE_PASSWORD=${SECRET_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "PIFLASH_KEY_ALIAS=${SECRET_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "PIFLASH_KEY_PASSWORD=${SECRET_KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "No upload keystore secret — generating a CI keystore for this run"
            keytool -genkeypair -noprompt -keystore "$KS" -storepass android -keypass android -alias piflash -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PiFlash CI, OU=Leftclick, O=Leftclick AG, L=Basel, C=CH"
            echo "PIFLASH_STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "PIFLASH_KEY_ALIAS=piflash" >> "$GITHUB_ENV"
            echo "PIFLASH_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi
          echo "PIFLASH_STORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build release bundle
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: PiFlash-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with AAB
        uses: softprops/action-gh-release@v3
        with:
          tag_name: aab-v3.2-${{ github.run_number }}
          name: PiFlash 3.2.${{ github.run_number }} AAB
          body_path: ${{ env.RELEASE_NOTES_FILE }}
          files: app/build/outputs/bundle/release/*.aab
          fail_on_unmatched_files: true

      - name: Write Play service account (optional)
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_JSON:-}" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON not set — skip Play upload"
            echo "PLAY_UPLOAD=0" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$PLAY_JSON" > "$HOME/play-sa.json"
          echo "PLAY_SA_FILE=$HOME/play-sa.json" >> "$GITHUB_ENV"
          echo "PLAY_UPLOAD=1" >> "$GITHUB_ENV"

      - name: Upload AAB to Google Play
        if: env.PLAY_UPLOAD == '1'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ env.PLAY_SA_FILE }}
          packageName: piflash.shizoghost.com
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ env.PLAY_TRACK }}
          status: completed
          releaseName: ${{ env.PIFLASH_VERSION_NAME }}
          whatsNewDirectory: play-whatsnew

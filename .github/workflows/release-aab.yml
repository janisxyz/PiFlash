name: Release AAB

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Release note"
        required: false
        default: "Play Store upload bundle"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "tools platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode upload keystore
        if: ${{ secrets.PIFLASH_STORE_BASE64 != '' }}
        env:
          PIFLASH_STORE_BASE64: ${{ secrets.PIFLASH_STORE_BASE64 }}
        run: |
          echo "$PIFLASH_STORE_BASE64" | base64 -d > "$HOME/piflash-upload.jks"
          echo "PIFLASH_STORE_FILE=$HOME/piflash-upload.jks" >> "$GITHUB_ENV"

      - name: Build release bundle
        env:
          PIFLASH_STORE_PASSWORD: ${{ secrets.PIFLASH_STORE_PASSWORD }}
          PIFLASH_KEY_ALIAS: ${{ secrets.PIFLASH_KEY_ALIAS }}
          PIFLASH_KEY_PASSWORD: ${{ secrets.PIFLASH_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PiFlash-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

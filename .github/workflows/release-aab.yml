name: Release AAB

on:
  workflow_dispatch:
    inputs:
      play_track:
        description: Play track (only used if PLAY_SERVICE_ACCOUNT_JSON is set)
        type: choice
        options:
          - internal
          - production
        default: internal
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "tools platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Version for this run
        run: |
          echo "PIFLASH_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "PIFLASH_VERSION_NAME=3.2.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "versionName 3.2.${{ github.run_number }} / versionCode ${{ github.run_number }}"

      - name: Prepare upload keystore
        env:
          PIFLASH_STORE_BASE64: ${{ secrets.PIFLASH_STORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.PIFLASH_STORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.PIFLASH_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.PIFLASH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$HOME/piflash-upload.jks"
          if [ -n "${PIFLASH_STORE_BASE64:-}" ]; then
            echo "$PIFLASH_STORE_BASE64" | base64 -d > "$KS"
            echo "Using PIFLASH_STORE_BASE64 secret"
            echo "PIFLASH_STORE_PASSWORD=${SECRET_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "PIFLASH_KEY_ALIAS=${SECRET_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "PIFLASH_KEY_PASSWORD=${SECRET_KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "No upload keystore secret — generating a CI keystore for this run"
            keytool -genkeypair -noprompt \
              -keystore "$KS" \
              -storepass android \
              -keypass android \
              -alias piflash \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=PiFlash CI, OU=Leftclick, O=Leftclick AG, L=Basel, C=CH"
            echo "PIFLASH_STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "PIFLASH_KEY_ALIAS=piflash" >> "$GITHUB_ENV"
            echo "PIFLASH_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi
          echo "PIFLASH_STORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build release bundle
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PiFlash-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aab-v3.2-${{ github.run_number }}
          name: PiFlash 3.2.${{ github.run_number }} AAB
          body: |
            Play upload bundle (signed).
            Package: piflash.shizoghost.com
            versionName 3.2.${{ github.run_number }} / versionCode ${{ github.run_number }}
          files: app/build/outputs/bundle/release/*.aab
          fail_on_unmatched_files: true

      - name: Write Play service account (optional)
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_JSON:-}" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON not set — skip Play upload"
            echo "PLAY_UPLOAD=0" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$PLAY_JSON" > "$HOME/play-sa.json"
          echo "PLAY_SA_FILE=$HOME/play-sa.json" >> "$GITHUB_ENV"
          echo "PLAY_UPLOAD=1" >> "$GITHUB_ENV"

      - name: Upload AAB to Google Play
        if: env.PLAY_UPLOAD == '1'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ env.PLAY_SA_FILE }}
          packageName: piflash.shizoghost.com
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.play_track || 'internal' }}
          status: completed

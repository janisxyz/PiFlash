name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "tools platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Version for this commit
        run: |
          set -euo pipefail
          COUNT=$(git rev-list --count HEAD)
          CODE=$((COUNT + 1000))
          NAME="3.4.${COUNT}"
          echo "PIFLASH_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "PIFLASH_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "versionName $NAME / versionCode $CODE"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: PiFlash-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-${{ env.PIFLASH_VERSION_NAME }}
          name: PiFlash ${{ env.PIFLASH_VERSION_NAME }} (debug APK)
          body: |
            Debug APK ${{ env.PIFLASH_VERSION_NAME }} (versionCode ${{ env.PIFLASH_VERSION_CODE }}).
            Same version as the Play AAB for this commit. Sideload package is `.debug`.
            Confirm this version in Settings before reporting USB errors.
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "tools platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Version for this run
        run: |
          echo "PIFLASH_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "PIFLASH_VERSION_NAME=3.2.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "versionName 3.2.${{ github.run_number }} / versionCode ${{ github.run_number }}"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: PiFlash-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-v3.2-${{ github.run_number }}
          name: PiFlash 3.2.${{ github.run_number }} (debug APK)
          body: |
            Debug APK from GitHub Actions (3.2.${{ github.run_number }}).
            Sideload and allow unknown sources. USB host required.
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
